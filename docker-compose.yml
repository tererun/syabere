services:
  syabere:
    build: .
    container_name: syabere
    restart: unless-stopped
    env_file: .env
    environment:
      # コンテナ内ではすべてのインタフェースで bind し、外向きは ports で絞る
      OAUTH_SERVER_HOST: 0.0.0.0
      TOKEN_STORE_PATH: /app/.data/google-tokens.json
    ports:
      # ホスト側の bind 先は .env の OAUTH_SERVER_HOST / PORT で指定
      - "${OAUTH_SERVER_HOST:-127.0.0.1}:${OAUTH_SERVER_PORT:-3000}:${OAUTH_SERVER_PORT:-3000}"
    volumes:
      # 暗号化済 refresh_token を永続化
      - ./.data:/app/.data
    stop_grace_period: 15s
