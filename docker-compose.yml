services:
  syabere:
    build: .
    container_name: syabere
    restart: unless-stopped
    env_file: .env
    environment:
      # コンテナ内ではすべてのインタフェースで bind し、ホスト側で 127.0.0.1 に絞る
      OAUTH_SERVER_HOST: 0.0.0.0
      OAUTH_SERVER_PORT: "3000"
      TOKEN_STORE_PATH: /app/.data/google-tokens.json
    ports:
      # Google OAuth コールバック。ホストの localhost からのみ受ける
      - "127.0.0.1:3000:3000"
    volumes:
      # 暗号化済 refresh_token を永続化
      - ./.data:/app/.data
    stop_grace_period: 15s
